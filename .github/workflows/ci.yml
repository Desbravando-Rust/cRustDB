name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --workspace
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: >-
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          --ignore-filename-regex 'crustdb-app/src/ui/' -- --include-ignored
      - name: Enforce line-coverage floors (spec section 9)
        run: |
          awk -v floors='crates/crustdb-core/=90,crates/crustdb-postgres/=70,crates/crustdb-mysql/=70,crates/crustdb-app/src/state/=70' '
            BEGIN { n = split(floors, f, ","); for (i = 1; i <= n; i++) { split(f[i], kv, "="); pat[i] = kv[1]; min[i] = kv[2] } }
            /^SF:/ { file = substr($0, 4) }
            /^DA:/ { split(substr($0, 4), a, ","); for (i = 1; i <= n; i++) if (index(file, pat[i])) { tot[i]++; if (a[2] > 0) hit[i]++ } }
            END {
              for (i = 1; i <= n; i++) {
                pct = tot[i] ? 100 * hit[i] / tot[i] : 0
                printf "%s %.1f%% (floor %d%%)\n", pat[i], pct, min[i]
                if (pct < min[i]) bad = 1
              }
              exit bad
            }' lcov.info
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "postgres:12", mysql: "mysql:8.4" }
          - { pg: "postgres:latest", mysql: "mysql:8.4" }
          - { pg: "postgres:latest", mysql: "mysql:5.6" }
          - { pg: "postgres:latest", mysql: "mysql:5.7" }
          - { pg: "postgres:latest", mysql: "mariadb:10.0" }
          - { pg: "postgres:latest", mysql: "mariadb:latest" }
    env:
      CRUSTDB_PG_IMAGE: ${{ matrix.pg }}
      CRUSTDB_MYSQL_IMAGE: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --workspace -- --include-ignored

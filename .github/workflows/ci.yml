name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check-files:
    runs-on: ubuntu-latest
    outputs:
      has_extension: ${{ steps.filter.outputs.match }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EXT_LIST: ${{ vars.CHECK_TARGET_EXTENSION }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -f # keep patterns like *.rs from globbing against the checkout
          # New branches (no usable base) always run everything.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pats=$(echo "${EXT_LIST:-*.rs}" | tr ',' ' ')
          match=false
          while IFS= read -r f; do
            for pat in $pats; do
              case "$f" in $pat) echo "relevant: $f"; match=true ;; esac
            done
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "match=$match" >> "$GITHUB_OUTPUT"

  fmt:
    needs: check-files
    if: needs.check-files.outputs.has_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    needs: check-files
    if: needs.check-files.outputs.has_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: [check-files, fmt, clippy, deny]
    if: needs.check-files.outputs.has_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --fail-fast
  deny:
    needs: [check-files]
    if: needs.check-files.outputs.has_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
      - run: cargo deny check
  coverage:
    needs: [check-files, fmt, clippy, deny]
    if: needs.check-files.outputs.has_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Pre-pull test images (retry transient registry errors)
        run: |
          for img in "${CRUSTDB_PG_IMAGE:-postgres:latest}" "${CRUSTDB_MYSQL_IMAGE:-mysql:8.4}" linuxserver/openssh-server:latest; do
            for i in 1 2 3 4 5; do docker pull -q "$img" && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          done
      - run: >-
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          --ignore-filename-regex 'crustdb-app/src/ui/' --run-ignored all -E 'not test(keyring_roundtrip)'
      - name: Enforce line-coverage floors (spec section 9)
        run: |
          awk -v floors='crates/crustdb-core/=90,crates/crustdb-postgres/=70,crates/crustdb-mysql/=70,crates/crustdb-app/src/state/=70' '
            BEGIN { n = split(floors, f, ","); for (i = 1; i <= n; i++) { split(f[i], kv, "="); pat[i] = kv[1]; min[i] = kv[2] } }
            /^SF:/ { file = substr($0, 4) }
            /^DA:/ { split(substr($0, 4), a, ","); for (i = 1; i <= n; i++) if (index(file, pat[i])) { tot[i]++; if (a[2] > 0) hit[i]++ } }
            END {
              for (i = 1; i <= n; i++) {
                pct = tot[i] ? 100 * hit[i] / tot[i] : 0
                printf "%s %.1f%% (floor %d%%)\n", pat[i], pct, min[i]
                if (pct < min[i]) bad = 1
              }
              exit bad
            }' lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

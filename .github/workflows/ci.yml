name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    needs: [fmt, clippy, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --fail-fast
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
      - run: cargo deny check
  coverage:
    needs: [fmt, clippy, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Pre-pull test images (retry transient registry errors)
        run: |
          for img in "${CRUSTDB_PG_IMAGE:-postgres:latest}" "${CRUSTDB_MYSQL_IMAGE:-mysql:8.4}" linuxserver/openssh-server:latest; do
            for i in 1 2 3 4 5; do docker pull -q "$img" && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          done
      - run: >-
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          --ignore-filename-regex 'crustdb-app/src/ui/' --run-ignored all -E 'not test(keyring_roundtrip)'
      - name: Enforce line-coverage floors (spec section 9)
        run: |
          awk -v floors='crates/crustdb-core/=90,crates/crustdb-postgres/=70,crates/crustdb-mysql/=70,crates/crustdb-app/src/state/=70' '
            BEGIN { n = split(floors, f, ","); for (i = 1; i <= n; i++) { split(f[i], kv, "="); pat[i] = kv[1]; min[i] = kv[2] } }
            /^SF:/ { file = substr($0, 4) }
            /^DA:/ { split(substr($0, 4), a, ","); for (i = 1; i <= n; i++) if (index(file, pat[i])) { tot[i]++; if (a[2] > 0) hit[i]++ } }
            END {
              for (i = 1; i <= n; i++) {
                pct = tot[i] ? 100 * hit[i] / tot[i] : 0
                printf "%s %.1f%% (floor %d%%)\n", pat[i], pct, min[i]
                if (pct < min[i]) bad = 1
              }
              exit bad
            }' lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
  release:
    # Tag pushes only (v*); never on branch pushes or pull requests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, deny, coverage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag matches crate version
        id: ver
        run: |
          v="$(awk -F'"' '/^version/ {print $2; exit}' crates/crustdb-app/Cargo.toml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$v" = "${GITHUB_REF_NAME#v}" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::warning::tag $GITHUB_REF_NAME != crate version $v; skipping Sentry release"
          fi
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev flatpak flatpak-builder
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
      # bwrap (flatpak-builder) needs unprivileged user namespaces, blocked by AppArmor on ubuntu-24.04.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: packaging/build-linux.sh "${GITHUB_REF_NAME#v}"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/*.AppImage
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/*.flatpak
      - name: Sentry not configured
        if: env.HAS_SENTRY != 'true'
        run: echo "::warning::Sentry not configured; skipping release"
      - name: Sentry release
        if: env.HAS_SENTRY == 'true' && steps.ver.outputs.match == 'true'
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: crustdb-app@${{ steps.ver.outputs.version }}

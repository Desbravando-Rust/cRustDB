name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --workspace
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  coverage:
    runs-on: ubuntu-latest
    steps:
      - run: echo "enabled in Task 35"
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "postgres:12", mysql: "mysql:8.4" }
          - { pg: "postgres:latest", mysql: "mysql:8.4" }
          - { pg: "postgres:latest", mysql: "mysql:5.6" }
          - { pg: "postgres:latest", mysql: "mysql:5.7" }
          - { pg: "postgres:latest", mysql: "mariadb:10.0" }
          - { pg: "postgres:latest", mysql: "mariadb:latest" }
    env:
      CRUSTDB_PG_IMAGE: ${{ matrix.pg }}
      CRUSTDB_MYSQL_IMAGE: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --workspace -- --include-ignored

name: release
on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify release (rc | real | mismatch)
        id: ver
        run: |
          v="$(awk -F'"' '/^version = / {print $2; exit}' crates/crustdb-app/Cargo.toml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          kind="$(packaging/release.sh kind "$GITHUB_REF_NAME" "$v")"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          [ "$kind" = real ] || echo "::notice::$GITHUB_REF_NAME is $kind (crate $v); CHANGELOG and Sentry untouched"
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev flatpak flatpak-builder
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
      # bwrap (flatpak-builder) needs unprivileged user namespaces, blocked by AppArmor on ubuntu-24.04.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: packaging/build-linux.sh "${GITHUB_REF_NAME#v}"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Upload installers to the release
        run: gh release upload "$GITHUB_REF_NAME" target/dist/*.AppImage target/dist/*.tar.gz target/dist/*.deb target/dist/*.rpm target/dist/*.flatpak --clobber
      - name: Release notes from CHANGELOG
        if: steps.ver.outputs.kind == 'real'
        run: |
          packaging/release.sh notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if [ -s release-notes.md ]; then gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else echo "::warning::no CHANGELOG section for $GITHUB_REF_NAME"; fi
      # Normally a no-op (make release already merged the CHANGELOG); opens a PR, never pushes to main.
      - name: Fold changelog fragments into CHANGELOG.md
        if: steps.ver.outputs.kind == 'real'
        run: |
          compgen -G "changelog.d/*.md" >/dev/null || { echo "no fragments"; exit 0; }
          branch="release/changelog-$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git switch -q -c "$branch" origin/main
          packaging/release.sh changelog "${GITHUB_REF_NAME#v}"
          git add CHANGELOG.md changelog.d
          git commit -q -m "chore(release): changelog $GITHUB_REF_NAME"
          git push -q -u origin "$branch"
          gh pr create --base main --title "chore(release): changelog $GITHUB_REF_NAME" --body "Fold \`changelog.d/\` into the CHANGELOG for $GITHUB_REF_NAME."
      - name: Sentry not configured
        if: env.HAS_SENTRY != 'true'
        run: echo "::warning::Sentry not configured; skipping release"
      - name: Sentry release
        if: env.HAS_SENTRY == 'true' && steps.ver.outputs.kind == 'real'
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: crustdb-app@${{ steps.ver.outputs.version }}

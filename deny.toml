[advisories]
version = 2
# All four are "unmaintained" notices with no patched version (patched = []); each crate is
# already on its latest published release, so there is nothing to bump.
ignore = [
    # ttf-parser: winit 0.30 -> sctk-adwaita 0.10 -> ab_glyph -> owned_ttf_parser -> ttf-parser.
    # Revisit when eframe adopts winit 0.31 / sctk-adwaita >= 0.12.
    "RUSTSEC-2026-0192",
    # zbus_names, zvariant, zvariant_derive: folded into zbus 6. Pulled in by eframe
    # (accesskit_unix/atspi) and by keyring (secret-service / zbus-secret-service-keyring-store).
    # Revisit when both migrate to zbus 6.
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
    # rsa (Marvin timing leak, no patch upstream) via russh's `rsa` feature. Accepted: it only
    # signs the SSH auth challenge with the user's own RSA key, in a desktop client with no retry
    # loop, so an observer needs many signatures from one session. Without it RSA-only users and
    # RSA-only hosts cannot use the tunnel. Revisit when `rsa` ships a fix (then drop this entry).
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]


# Transitive eframe deps with licenses outside the global allow list.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# Build dep via sqlparser -> recursive -> stacker -> psm.
[[licenses.exceptions]]
crate = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

# Root store data pulled by mysql_async rustls backend.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

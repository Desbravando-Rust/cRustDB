[package]
name = "crustdb-core"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlparser = { version = "0.63.0", features = ["visitor"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "sql"
harness = false

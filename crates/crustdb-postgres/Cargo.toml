[package]
name = "crustdb-postgres"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
crustdb-core = { version = "0.1.0", path = "../crustdb-core" }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
secrecy = "0.10.3"
tokio = { version = "1.53.3", features = ["rt", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"

[dev-dependencies]
crustdb-testkit = { path = "../crustdb-testkit" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[package]
name = "crustdb-mysql"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
crustdb-core = { version = "0.1.0", path = "../crustdb-core" }
mysql_async = { version = "0.37.1", default-features = false, features = ["aws-lc-rs", "minimal-rust", "rustls-tls", "tls12"] }
rustls = "0.23.46"
secrecy = "0.10.3"
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }

[dev-dependencies]
crustdb-testkit = { path = "../crustdb-testkit" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }


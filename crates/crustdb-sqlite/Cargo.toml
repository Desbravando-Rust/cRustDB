[package]
name = "crustdb-sqlite"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
crustdb-core = { version = "0.1.0", path = "../crustdb-core" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "column_decltype"] }
tokio = { version = "1.53.3", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }

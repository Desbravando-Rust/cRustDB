[package]
name = "crustdb-redis"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
crustdb-core = { version = "0.1.0", path = "../crustdb-core" }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
secrecy = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "time"] }
tokio-rustls = "0.26.6"

[dev-dependencies]
crustdb-testkit = { path = "../crustdb-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

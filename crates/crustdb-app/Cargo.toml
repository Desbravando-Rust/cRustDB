[package]
name = "crustdb-app"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native client for PostgreSQL, MySQL/MariaDB and SQLite"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crustdb-core = { version = "0.1.0", path = "../crustdb-core" }
crustdb-mysql = { version = "0.1.0", path = "../crustdb-mysql" }
crustdb-postgres = { version = "0.1.0", path = "../crustdb-postgres" }
crustdb-redis = { version = "0.1.0", path = "../crustdb-redis" }
crustdb-sqlite = { version = "0.1.0", path = "../crustdb-sqlite" }
eframe = { version = "0.37.0", features = ["persistence"] }
egui-phosphor = "0.14.0"
egui_extras = { version = "0.37.0", features = ["image"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = "4.2.0"
rfd = "0.17.2"
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
secrecy = "0.10.3"
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "io-util", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"

[[bin]]
name = "crustdb"
path = "src/main.rs"

[dev-dependencies]
crustdb-testkit = { path = "../crustdb-testkit" }
egui_kittest = "0.37.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "test-util"] }

# Linux packages (packaging/build-linux.sh). Source paths are relative to this crate;
# target/release/* is resolved against the workspace target dir.
[package.metadata.deb]
name = "crustdb"
maintainer = "zejuniortdr <zejuniortdr@gmail.com>"
section = "database"
# eframe (wgpu) dlopens xkbcommon and libvulkan.so.1 (fallback libEGL.so.1), so $auto cannot see them.
depends = "$auto, libxkbcommon0, libvulkan1 | libegl1"
assets = [
  ["target/release/crustdb", "usr/bin/", "755"],
  ["../../packaging/crustdb.desktop", "usr/share/applications/", "644"],
  ["../../packaging/crustdb.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "crustdb"
assets = [
  { source = "target/release/crustdb", dest = "/usr/bin/crustdb", mode = "755" },
  { source = "../../packaging/crustdb.desktop", dest = "/usr/share/applications/crustdb.desktop", mode = "644" },
  { source = "../../packaging/crustdb.png", dest = "/usr/share/icons/hicolor/256x256/apps/crustdb.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
vulkan-loader = "*"

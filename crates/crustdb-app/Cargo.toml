[package]
name = "crustdb-app"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crustdb-core = { version = "0.1.0", path = "../crustdb-core" }
eframe = "0.37.0"
keyring = "4.2.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[[bin]]
name = "crustdb"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
uuid = "1.28.0"
